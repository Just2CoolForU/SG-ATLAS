<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG ATLAS — An Interpretive Tool for Cryo-EM Structures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HERO SECTION ============ -->
<section class="hero">

  <!-- Wireframe crystal background (SVG, decorative) -->
  <svg class="crystal-bg crystal-top-right" viewBox="0 0 400 400" aria-hidden="true">
    <polygon points="200,10 320,90 280,220 120,220 80,90" fill="none" stroke="#5b6472" stroke-width="1.5"/>
    <polygon points="200,10 320,90 200,140" fill="none" stroke="#5b6472" stroke-width="1.5"/>
    <polygon points="200,10 80,90 200,140" fill="none" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="200" y1="140" x2="200" y2="10" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="120" y1="220" x2="200" y2="140" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="280" y1="220" x2="200" y2="140" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="80" y1="90" x2="200" y2="140" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="320" y1="90" x2="200" y2="140" stroke="#5b6472" stroke-width="1.5"/>
  </svg>

  <svg class="crystal-bg crystal-bottom-right" viewBox="0 0 420 420" aria-hidden="true">
    <polygon points="210,20 350,110 300,260 120,260 70,110" fill="none" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="210" y1="20" x2="210" y2="180" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="70" y1="110" x2="210" y2="180" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="350" y1="110" x2="210" y2="180" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="120" y1="260" x2="210" y2="180" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="300" y1="260" x2="210" y2="180" stroke="#5b6472" stroke-width="1.5"/>
  </svg>

  <svg class="crystal-bg crystal-bottom-left" viewBox="0 0 380 380" aria-hidden="true">
    <polygon points="190,15 300,85 260,210 120,210 80,85" fill="none" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="190" y1="15" x2="190" y2="150" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="80" y1="85" x2="190" y2="150" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="300" y1="85" x2="190" y2="150" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="120" y1="210" x2="190" y2="150" stroke="#5b6472" stroke-width="1.5"/>
    <line x1="260" y1="210" x2="190" y2="150" stroke="#5b6472" stroke-width="1.5"/>
  </svg>

  <svg class="crystal-shard" viewBox="0 0 220 420" aria-hidden="true">
    <polygon points="110,10 150,90 150,330 110,410 70,330 70,90" fill="none" stroke="#8b93a0" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="150" y2="90" stroke="#8b93a0" stroke-width="1.5"/>
    <line x1="70" y1="330" x2="150" y2="330" stroke="#8b93a0" stroke-width="1.5"/>
    <line x1="110" y1="10" x2="110" y2="410" stroke="#8b93a0" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="110" y2="10" stroke="#8b93a0" stroke-width="1.5"/>
    <line x1="150" y1="90" x2="110" y2="10" stroke="#8b93a0" stroke-width="1.5"/>
  </svg>

  <!-- Nav -->
  <nav class="navbar">
    <a href="#home" class="nav-link">HOME</a>
    <a href="#tool" class="nav-link">SG ATLAS</a>
    <a href="#about" class="nav-link">ABOUT</a>
  </nav>

  <!-- Main hero content -->
  <div class="hero-grid">

    <div class="hero-left">
      <h1 class="wordmark">
        <span class="wordmark-line">SG</span>
        <span class="wordmark-line">ATLAS</span>
      </h1>
      <p class="tagline">An interpretive tool for Cryo-EM structures</p>

      <div class="cta-row">
        <a href="#tool" class="btn btn-primary">Use Tool</a>
        <a href="#database" class="btn btn-secondary">Discover Database</a>
      </div>
    </div>

    <div class="hero-center" aria-hidden="true">
      <svg class="chevron chevron-left" viewBox="0 0 40 60"><polyline points="32,4 8,30 32,56" fill="none" stroke="#c7cbd1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="hero-right">
      <div class="molecule-wrap">
        <svg class="molecule" viewBox="0 0 300 220" aria-hidden="true">
          <!-- backbone bonds -->
          <g stroke="#b9bec6" stroke-width="3" fill="none">
            <line x1="40" y1="150" x2="70" y2="120"/>
            <line x1="70" y1="120" x2="60" y2="90"/>
            <line x1="70" y1="120" x2="105" y2="130"/>
            <line x1="105" y1="130" x2="120" y2="100"/>
            <line x1="120" y1="100" x2="150" y2="105"/>
            <line x1="150" y1="105" x2="160" y2="75"/>
            <line x1="150" y1="105" x2="180" y2="120"/>
            <line x1="180" y1="120" x2="185" y2="90"/>
            <line x1="180" y1="120" x2="215" y2="110"/>
            <line x1="215" y1="110" x2="235" y2="85"/>
            <line x1="215" y1="110" x2="245" y2="130"/>
            <line x1="245" y1="130" x2="265" y2="115"/>
            <line x1="105" y1="130" x2="115" y2="160"/>
            <line x1="115" y1="160" x2="105" y2="185"/>
            <line x1="180" y1="120" x2="190" y2="150"/>
            <line x1="190" y1="150" x2="175" y2="175"/>
          </g>
          <!-- atoms -->
          <g>
            <circle cx="40" cy="150" r="9" fill="#e05c5c"/>
            <circle cx="70" cy="120" r="9" fill="#5b9bd5"/>
            <circle cx="60" cy="90" r="7" fill="#e05c5c"/>
            <circle cx="105" cy="130" r="9" fill="#4caf6a"/>
            <circle cx="120" cy="100" r="9" fill="#5b9bd5"/>
            <circle cx="150" cy="105" r="9" fill="#e0a83c"/>
            <circle cx="160" cy="75" r="7" fill="#e05c5c"/>
            <circle cx="180" cy="120" r="9" fill="#5b9bd5"/>
            <circle cx="185" cy="90" r="7" fill="#8a6de0"/>
            <circle cx="215" cy="110" r="9" fill="#4caf6a"/>
            <circle cx="235" cy="85" r="7" fill="#e0a83c"/>
            <circle cx="245" cy="130" r="9" fill="#5b9bd5"/>
            <circle cx="265" cy="115" r="7" fill="#e05c5c"/>
            <circle cx="115" cy="160" r="7" fill="#8a6de0"/>
            <circle cx="105" cy="185" r="7" fill="#e0a83c"/>
            <circle cx="190" cy="150" r="7" fill="#4caf6a"/>
            <circle cx="175" cy="175" r="7" fill="#5b9bd5"/>
          </g>
          <!-- ground shadow -->
          <ellipse cx="155" cy="205" rx="95" ry="7" fill="#000" opacity="0.06"/>
        </svg>
        <p class="molecule-id">6XYO</p>
      </div>
    </div>

    <div class="hero-chevron-right" aria-hidden="true">
      <svg class="chevron chevron-right" viewBox="0 0 40 60"><polyline points="8,4 32,30 8,56" fill="none" stroke="#c7cbd1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

  </div>
</section>

<!-- ============ PROTEIN ANIMATION SCROLLER ============ -->
<section class="scroller-section" id="gallery" aria-label="Protein structure animations">
  <div class="scroller-header">
    <p class="scroller-eyebrow">Structures in motion</p>
    <h2 class="scroller-title">A closer look at the fold</h2>
  </div>

  <div class="scroller-viewport">
    <button class="scroller-arrow scroller-arrow-left" aria-label="Previous animation">
      <svg viewBox="0 0 40 60"><polyline points="32,4 8,30 32,56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="scroller-track" id="scrollerTrack">
      <!-- Slides are populated by JS from the PROTEIN_ANIMATIONS array in script.js.
           Each slide expects: { src: 'assets/your-file.mp4' or '.gif', caption: 'Label', id: 'PDB ID' } -->
    </div>

    <button class="scroller-arrow scroller-arrow-right" aria-label="Next animation">
      <svg viewBox="0 0 40 60"><polyline points="8,4 32,30 8,56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="scroller-dots" id="scrollerDots" aria-hidden="true"></div>
</section>

<script src="script.js"></script>
</body>
</html>
